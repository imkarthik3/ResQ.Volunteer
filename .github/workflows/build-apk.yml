name: Build ResQ Volunteer APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Extract project ZIP
        run: |
          sudo apt-get update
          sudo apt-get install -y unzip

          ZIP_FILE=$(find . -maxdepth 1 -type f -iname "*.zip" | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: No ZIP file found"
            exit 1
          fi

          echo "Found ZIP: $ZIP_FILE"

          rm -rf extracted
          mkdir extracted

          unzip -o "$ZIP_FILE" -d extracted

      - name: Check Android project
        run: |
          if [ ! -f "extracted/settings.gradle.kts" ]; then
            echo "ERROR: settings.gradle.kts not found"
            find extracted -maxdepth 3 -type f
            exit 1
          fi

          if [ ! -d "extracted/app" ]; then
            echo "ERROR: app folder not found"
            exit 1
          fi

          echo "Android project found"

      - name: Add Firebase configuration
        run: |
          if [ ! -f "google-services.json" ]; then
            echo "ERROR: google-services.json is missing"
            exit 1
          fi

          cp google-services.json extracted/app/google-services.json

          echo "Firebase configuration copied"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          accept-android-sdk-licenses: true

      - name: Install Android SDK packages
        run: |
          sdkmanager "platform-tools"
          sdkmanager "platforms;android-36"
          sdkmanager "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Build Debug APK
        working-directory: extracted
        run: |
          gradle :app:assembleDebug --stacktrace

      - name: Find APK
        run: |
          find extracted/app/build/outputs -type f -name "*.apk" -print

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: rescuer-console-debug-apk
          path: extracted/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
