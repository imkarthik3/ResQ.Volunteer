name: Build Rescuer Console APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Extract project ZIP
        run: |
          sudo apt-get update
          sudo apt-get install -y unzip

          ZIP_FILE=$(find . -maxdepth 1 -type f -iname "*.zip" | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: No ZIP file found in repository."
            exit 1
          fi

          echo "Found ZIP: $ZIP_FILE"

          rm -rf extracted
          mkdir extracted

          unzip -o "$ZIP_FILE" -d extracted

      - name: Check Android project
        run: |
          if [ ! -f "extracted/settings.gradle.kts" ]; then
            echo "ERROR: settings.gradle.kts not found."
            echo "ZIP contents:"
            find extracted -maxdepth 3 -type f
            exit 1
          fi

          if [ ! -d "extracted/app" ]; then
            echo "ERROR: app folder not found."
            exit 1
          fi

          echo "Android project found successfully."

      - name: Add Firebase configuration
        run: |
          if [ ! -f "google-services.json" ]; then
            echo "ERROR: google-services.json is missing."
            echo "Please upload google-services.json to the root of the GitHub repository."
            exit 1
          fi

          cp google-services.json extracted/app/google-services.json

          echo "google-services.json copied successfully."

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          accept-android-sdk-licenses: 'false'
          log-accepted-android-sdk-licenses: 'false'
          packages: ''

      - name: Accept Android SDK licenses
        run: |
          yes | sdkmanager --licenses || true

      - name: Install Android SDK packages
        run: |
          sdkmanager "platform-tools"
          sdkmanager "platforms;android-36"
          sdkmanager "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Build Debug APK
        working-directory: extracted
        run: |
          gradle :app:assembleDebug --stacktrace

      - name: Find
